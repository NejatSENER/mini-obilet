name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -warnaserror
      - run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        run: dotnet publish src/MiniObilet.Api -c Release --no-build -o publish

      - name: Idempotent migration script (for review)
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent --project src/MiniObilet.Api --configuration Release --no-build --output migrations.sql

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

      - uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: migrations.sql

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write   # OIDC: sign in to Azure without stored credentials
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - name: Azure login (OIDC, federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Smoke test (/health)
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/health"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            echo "Attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "The app did not report healthy"
          exit 1
